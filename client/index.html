<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/proodos.svg" />
    <link rel="alternate icon" href="/proodos.svg" />
    <link rel="apple-touch-icon" href="/proodos.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proodos — Turn Learning Into Progress</title>
    <meta name="description" content="Build learning roadmaps, track skills, stay consistent, and measure your progress with Proodos." />
    <script>
      (function() {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          // Default to dark mode if no preference set or set to 'dark'
          document.documentElement.classList.add('dark');
          if (!storedTheme) {
            localStorage.setItem('theme', 'dark');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
