<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="proodos-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#3A7D53" filter="url(#proodos-shadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
  
  <!-- Greek Letter Pi (Π) for Proodos -->
  <text 
    x="64" 
    y="86" 
    font-family="'Georgia', 'Times New Roman', serif" 
    font-size="76" 
    font-weight="900" 
    fill="#FBF9F4" 
    text-anchor="middle"
    letter-spacing="1"
  >Π</text>
</svg>
